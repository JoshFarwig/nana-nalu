[project]
name = "backend"
version = "0.1.0"
description = "Data gathering, processing, and exposure via API for nānā-nalu"
readme = "README.md"
requires-python="~=3.12.10"
# TODO: pin and reorganize depdencies to 
# their associated dependency-groups
dependencies = [
  "sqlalchemy[asyncio]~=2.0.44",
  "geoalchemy2~=0.18.0",
  "asyncpg~=0.30.0",
  "pydantic~=2.12.4",
  "pydantic-settings~=2.12.0",
  "redis~=7.0.1",
  "httpx~=0.28.1",
  "bcrypt~=5.0.0",
  "python-json-logger~=4.0.0",
]

[dependency-groups]
api = [
  "fastapi[standard]>=0.115.12",
  "uvicorn>=0.34.3",
  "alembic~=1.16.1",
  "psycopg2-binary>=2.9.0",
  
] 
celery = [
  "celery~=5.5.3", 
  "numpy>=2.3.4",
  "aiofiles>=25.1.0",
  "xarray>=2025.10.1",
  "cfgrib>=0.9.15.1",
  "scipy>=1.16.3",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
  "scipy-stubs>=1.16.3.0",
]

