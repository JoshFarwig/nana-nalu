[pytest]
# Pytest configuration for nānā-nalu backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
pythonpath = .

# Markers
markers =
    integration: Integration tests (require Docker services)
    unit: Unit tests (fast, no external dependencies)

# Asyncio mode
asyncio_mode = auto

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Ignore
norecursedirs = .git .venv __pycache__ .pytest_cache *.egg-info
