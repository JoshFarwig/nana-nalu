# base Docker Compose file
# use with environment-specific overrides:
#   dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  db:
    # NOTE: uses a dockerfile to build the PostGIS image, primarily because
    # the official postgis image doesn't have any arm64 builds (for macos)
    build:
      context: ./db
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_USER: ${DB__USERNAME}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    networks: [nn_network]
    healthcheck:
      test: |
        psql -U $DB__USERNAME -d $DB__NAME \
        -c "SELECT 1" > /dev/null || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile.redis
    environment:
      REDIS__PASSWORD: ${REDIS__PASSWORD}
    restart: always
    networks: [nn_network]
    healthcheck:
      test: |
        REDISCLI_AUTH=$REDIS__PASSWORD redis-cli SET hc ok EX 10 && \
        REDISCLI_AUTH=$REDIS__PASSWORD redis-cli GET hc | grep -q ok || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ./backend
    environment:
      ENV: ${ENV}
      LOCATION: ${LOCATION}
      # use __ nested env delimiter syntax for nested pydantic-settings objects
      # TODO: remove sensitive vars set as secret w/ pydantic-settings v2.12
      API__ADMIN_USERNAME: ${API__ADMIN_USERNAME}
      API__ADMIN_PASSWORD: ${API__ADMIN_PASSWORD}
      API__ADMIN_EMAIL: ${API__ADMIN_EMAIL}
      DB__HOST:  ${DB__HOST}
      DB__PORT: ${DB__PORT}
      DB__USERNAME:  ${DB__USERNAME}
      DB__PASSWORD:  ${DB__PASSWORD}
      DB__NAME: ${DB__NAME}
      REDIS__HOST: ${REDIS__HOST}
      REDIS__PORT:  ${REDIS__PORT}
      REDIS__PASSWORD: ${REDIS__PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # - worker
    networks: [nn_network]
    healthcheck:
      # TODO: create a healthcheck endpoint, just using root for now
      test: ["CMD", "curl", "-f", "http://localhost:${API__PORT:-8000}/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
  
  # Celery setup
  # worker: 
  #   build: 
  #     context: ./backend 
  #   environment: 
  #   depends_on: 
  #     - db 
  #     - redis 


  #   build: 
  #     context: ./backend 
  #   environment: 
  #   depends_on: 
  #     - db 
  #     - redis

volumes:
  pg_data:

networks: 
  nn_network:
    driver: bridge

# NOTE: using __ nested delimiter syntax for pydantic so 
# api.admin_username can be resolved from API__ADMIN_USERNAME
# as a secret or a env variable (secret safer though).
# unforunatelythis will not be rolled out until 
# pydantic-settings v2.12, so in the mean time, will wait and pass 
# secrets as env vars (which is not secure, bakes envs into images, 
# but also not publishing these to dockerhub, not yet atleast) 
