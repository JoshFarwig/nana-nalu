# base Docker Compose file
# use with environment-specific overrides:
#   dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

x-db-env: &db-env
  DB__HOST: ${DB__HOST}
  DB__PORT: ${DB__PORT}
  DB__USERNAME: ${DB__USERNAME}
  DB__PASSWORD: ${DB__PASSWORD}
  DB__NAME: ${DB__NAME}

x-redis-env: &redis-env
  REDIS__HOST: ${REDIS__HOST}
  REDIS__PORT: ${REDIS__PORT}
  REDIS__PASSWORD: ${REDIS__PASSWORD}

x-common-env: &common-env
  ENV: ${ENV}
  REGIONS: ${REGIONS}

services:
  # TODO: convert to timescale db for historical data?
  db:
    build:
      context: ./db
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_USER: ${DB__USERNAME}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    networks: [nn_network]
    healthcheck:
      test: |
        psql -U $DB__USERNAME -d $DB__NAME \
        -c "SELECT 1" > /dev/null || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile.redis
    environment:
    # TODO: remove sensitive vars set as secret w/ pydantic-settings v2.12:
      REDIS__PASSWORD: ${REDIS__PASSWORD}
    restart: always
    volumes: 
      - redis_data:/data
    networks: [nn_network]
    healthcheck:
      test: |
        REDISCLI_AUTH=$REDIS__PASSWORD redis-cli SET hc ok EX 10 && \
        REDISCLI_AUTH=$REDIS__PASSWORD redis-cli GET hc | grep -q ok || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: api
    environment:
      <<: [*common-env, *db-env, *redis-env]
      # use __ nested env delimiter syntax for nested pydantic-settings objects
      # TODO: remove sensitive vars set as secret w/ pydantic-settings v2.12
      API__ADMIN_USERNAME: ${API__ADMIN_USERNAME}
      API__ADMIN_PASSWORD: ${API__ADMIN_PASSWORD}
      API__ADMIN_EMAIL: ${API__ADMIN_EMAIL}
      API__JWT_SECRET_KEY: ${API__JWT_SECRET_KEY}
      API__RESEND_API_KEY: ${API__RESEND_API_KEY}
      API__APP_URL: ${API__APP_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nn_network]
    healthcheck:
      # TODO: create a healthcheck endpoint, just using root for now
      test: ["CMD", "curl", "-f", "http://localhost:${API__PORT:-8000}/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    environment:
      PREFECT_API_URL: http://prefect-server:${PREFECT__PORT:-4200}/api
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT__H_PORT:-4200}/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${DB__USERNAME}:${DB__PASSWORD}@${DB__HOST}:${DB__PORT}/prefect
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks: [nn_network]
    command: prefect server start --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  prefect-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: worker
    environment:
      <<: [*common-env, *db-env, *redis-env]
      PREFECT_API_URL: http://prefect-server:${PREFECT__PORT:-4200}/api
      POOL_NAME: forecasts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: always
    networks: [nn_network]

volumes:
  pg_data:
  redis_data:


networks: 
  nn_network:
    driver: bridge

