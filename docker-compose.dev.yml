# development environment overrides
# usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up

services:
  db:
    container_name: nn_db_dev
    image: nn-db:dev
    ports:
      - "${DB__H_PORT:-5432}:${DB__PORT:-5432}"
    networks: [nn_network]

  redis:
    container_name: nn_redis_dev
    ports:
      - "${REDIS__H_PORT:-6379}:${REDIS__PORT:-6379}"
    networks: [nn_network]

  api:
    container_name: nn_api_dev
    build: 
      dockerfile: Dockerfile.dev
      target: api
    image: nn_api:dev
    ports:
      - "${API__H_PORT:-8000}:${API__PORT:-8000}"
    develop:
      watch:
        - action: sync
          path: ./backend/api
          target: /app/api
        - action: sync
          path: ./backend/schemas
          target: /app/schemas
        - action: sync
          path: ./backend/services
          target: /app/services
        - action: sync+restart
          path: ./backend/models
          target: /app/models
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
        - action: sync+restart
          path: ./backend/core
          target: /app/core
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    networks: [nn_network]

networks: 
  nn_network: 
    name: nn_dev_network
