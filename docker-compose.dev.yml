# development environment overrides
# usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up

services:
  db:
    container_name: nn_db_dev
    image: nn_db:dev
    ports:
      - "${DB__H_PORT:-5432}:${DB__PORT:-5432}"
    networks: [nn_network]

  redis:
    container_name: nn_redis_dev
    image: nn_redis:dev
    ports:
      - "${REDIS__H_PORT:-6379}:${REDIS__PORT:-6379}"
    networks: [nn_network]

  api:
    container_name: nn_api_dev
    image: nn_api:dev
    command: uvicorn api.v1.main:app --reload --host 0.0.0.0 --port ${API__PORT:-8000}
    ports:
      - "${API__H_PORT:-8000}:${API__PORT:-8000}"
    develop:
      watch:
        - action: sync
          path: ./backend/api
          target: /backend/api
        - action: sync
          path: ./backend/schemas
          target: /backend/schemas
        - action: sync
          path: ./backend/services
          target: /backend/services
        - action: sync+restart
          path: ./backend/models
          target: /backend/models
        - action: sync+restart
          path: ./backend/migrations
          target: /backend/migrations
        - action: sync+restart
          path: ./backend/core
          target: /backend/core
        - action: sync+restart
          path: ./backend/utils
          target: /backend/utils
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    networks: [nn_network]

  worker:
    container_name: nn_worker_dev
    image: nn_worker:dev
    develop:
      watch:
        - action: sync+restart
          path: ./backend/workers
          target: /backend/workers
        - action: sync+restart
          path: ./backend/services
          target: /backend/services
        - action: sync+restart
          path: ./backend/core
          target: /backend/core
        - action: sync+restart
          path: ./backend/utils
          target: /backend/utils
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    networks: [nn_network]

  beat:
    container_name: nn_beat_dev
    image: nn_beat:dev
    develop:
      watch:
        - action: sync+restart
          path: ./backend/workers
          target: /backend/workers
        - action: sync+restart
          path: ./backend/core
          target: /backend/core
        - action: sync+restart
          path: ./backend/utils
          target: /backend/utils
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    networks: [nn_network]

  flower:
    container_name: nn_flower_dev
    image: nn_flower:dev
    ports:
      - "${FLOWER__H_PORT:-5555}:5555"
    develop:
      watch:
        - action: sync+restart
          path: ./backend/workers
          target: /backend/workers
        - action: sync+restart
          path: ./backend/core
          target: /backend/core
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
    networks: [nn_network]

networks:
  nn_network:
    name: nn_dev_network
