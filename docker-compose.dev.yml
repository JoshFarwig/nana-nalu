# Development environment overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up

services:
  db:
    container_name: nn-db-dev
    image: nn-db:dev
    environment:
      POSTGRES_USER: ${DB__USERNAME}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
      ports:
      - "5432:5432"

  redis:
    container_name: nn-redis-dev
    ports:
      - "6379:6379"

  api:
    container_name: nn-api-dev
    build:
      dockerfile: Dockerfile.dev
    image: nn-api:dev
    enviroment: 
      API_ENV: ${API_ENV} 
      # TODO: remove these from enviroment once 
      # pydantic-settings releases
      API__ADMIN_USERNAME: ${API__ADMIN_USERNAME}
    ports:
      - "8000:80"
    develop:
      watch:
        - action: sync
          path: ./backend/api
          target: /app/api
        - action: sync
          path: ./backend/schemas
          target: /app/schemas
        - action: sync
          path: ./backend/services
          target: /app/services
        - action: sync+restart
          path: ./backend/models
          target: /app/models
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
        - action: sync+restart
          path: ./backend/core
          target: /app/core
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

