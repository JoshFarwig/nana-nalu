# development environment overrides
# usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up

services:
  db:
    container_name: nn_db_dev
    image: nn_db:dev
    ports:
      - "${DB__H_PORT:-5432}:${DB__PORT:-5432}"
    networks: [nn_network]

  redis:
    container_name: nn_redis_dev
    image: nn_redis:dev
    ports:
      - "${REDIS__H_PORT:-6379}:${REDIS__PORT:-6379}"
    networks: [nn_network]

  api:
    container_name: nn_api_dev
    image: nn_api:dev
    command: uvicorn api.v1.main:app --reload --host 0.0.0.0 --port ${API__PORT:-8000}
    ports:
      - "${API__H_PORT:-8000}:${API__PORT:-8000}"
    volumes:
      - ./backend/api:/backend/api:cached
      - ./backend/schemas:/backend/schemas:cached
      - ./backend/services:/backend/services:cached
      - ./backend/scripts:/backend/scripts:cached
      - ./backend/models:/backend/models:cached
      - ./backend/migrations:/backend/migrations:cached
      - ./backend/alembic:/backend/alembic:cached
      - ./backend/core:/backend/core:cached
      - ./backend/utils:/backend/utils:cached
      - ./backend/repositories:/backend/repositories:cached
    networks: [nn_network]

  prefect-server:
    container_name: nn_prefect_server_dev
    ports:
      - "127.0.0.1:${PREFECT__H_PORT:-4200}:${PREFECT__PORT:-4200}"
    networks: [nn_network]

  prefect-worker:
    container_name: nn_prefect_worker_dev
    image: nn_prefect_worker:dev
    environment:
      PREFECT_API_URL: http://prefect-server:${PREFECT__PORT:-4200}/api
      PREFECT_LOGGING_SETTINGS_PATH: /backend/core/logging/logging.prefect.yaml
    volumes:
      - ./backend/workflows:/backend/workflows:cached
      - ./backend/services:/backend/services:cached
      - ./backend/models:/backend/models:cached
      - ./backend/alembic:/backend/alembic:cached
      - ./backend/core:/backend/core:cached
      - ./backend/utils:/backend/utils:cached
      - ./backend/repositories:/backend/repositories:cached
    networks: [nn_network]

networks:
  nn_network:
    name: nn_dev_network
