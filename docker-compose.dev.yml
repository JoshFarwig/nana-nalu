services:
  db: 
    container_name: nn-db-dev
    # NOTICE: This is deployment uses a dockerfile to build the PostGIS image, primarily because  
    # the official postgis image doesn't have any arm64 builds. 
    build: 
      context: ./db
      dockerfile: Dockerfile.postgis
    image: nn-db:dev
    restart: always
    environment:
      # TODO: change this to a more secure user? Pass via secrets
      POSTGRES_USER: nn_db_dev_user
      # TODO: change this to a more secure password? Pass via secrets
      POSTGRES_PASSWORD: nn_db_dev_password
      POSTGRES_DB: nn_db_dev 
    # TODO: change host port to env var if you want to expose db to host
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
      # Initialize the database with custom scripts 
      - ./db/init:/docker-entrypoint-initdb.d

  backend: 
    container_name: nn-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: nn-backend:dev
    depends_on:
      - db
    ports:
      - "8000:80"
    develop:
      watch:
        # Hot reload for API endpoints
        - action: sync
          path: ./backend/api
          target: /app/api 

  redis: 
    container_name: nn-redis-dev
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
